; BCA182 Laboratory Activity 2 - Personal MP3 Player
; RT-Thread RT-Spark (STM32F407ZGT6) + STM32Cube HAL + FreeRTOS
;
; The black_f407zg board definition uses the same MCU as the RT-Spark
; (STM32F407ZGT6, 1 MB flash, 192 KB RAM). Clock tree, pins and peripherals
; are configured for the RT-Spark in src/board_init.c.

[platformio]
default_envs = rtspark

[env:rtspark]
platform = ststm32
board = black_f407zg
framework = stm32cube

; Use our own include/stm32f4xx_hal_conf.h (8 MHz HSE, selected HAL modules)
board_build.stm32cube.custom_config_header = yes

; Cortex-M4F hard-float ABI (required by the FreeRTOS ARM_CM4F port)
extra_scripts = pre:tools/fpu_flags.py

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; Stricter warnings for the project's own sources (not the HAL / FreeRTOS)
build_src_flags =
    -Wshadow
    -Wdouble-promotion
    -Wfloat-conversion
    -Wformat=2
    -Wundef
    -Wcast-align
    -Wlogical-op
    -Wduplicated-cond
    -Wnull-dereference
    -Wmissing-declarations

; On-board ST-LINK (USB-DBG connector) for flashing and debugging
upload_protocol = stlink
debug_tool = stlink

; USART1 (PA9/PA10) is bridged to the ST-LINK virtual COM port
monitor_speed = 115200

; Tests run in the two environments below, not in the firmware build
test_ignore = *

; Static analysis of the project's own code:  pio check
; FreeRTOS, the ST HAL/CMSIS, the bitmap font and ST's HAL config template
; are third-party and left out (the HAL headers are still read for types).
; The course-provided song.h / song_def.h are kept unchanged, so they're
; analysed separately (docs/static-analysis.md) and their notes suppressed here.
; unusedFunction is suppressed: IRQ handlers and RTOS hooks are called by the
; hardware and the kernel, not by our code.
check_tool = cppcheck, clangtidy
check_skip_packages = no
check_src_filters =
    +<src/>
    +<include/>
    -<include/lcd_font.h>
    -<include/stm32f4xx_hal_conf.h>
    -<include/song.h>
    -<include/song_def.h>
check_flags =
    cppcheck: --enable=all --inline-suppr --std=c++14 --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppress=unusedFunction --suppress=useInitializationList:*song.h --suppress=passedByValue:*song.h
    clangtidy: --checks=-*,bugprone-*,cert-*,clang-analyzer-*,performance-*,portability-*,misc-*,-bugprone-easily-swappable-parameters,-bugprone-reserved-identifier,-cert-dcl37-c,-cert-dcl51-cpp,-misc-unused-parameters,-misc-include-cleaner,-misc-non-private-member-variables-in-classes,-performance-no-int-to-ptr --header-filter=include/(main|lcd|NHD_0216HZ|player_logic|synth|audio_player|timer_if|console|es8388|FreeRTOSConfig)\.h

; ---------------------------------------------------------------------------
; On-board tests (test/embedded), board connected over USB-DBG:
;   pio test -e rtspark_test
; Same firmware build without main.cpp: each test suite has its own main().
[env:rtspark_test]
extends = env:rtspark
test_framework = unity
test_filter = embedded/*
test_ignore =
test_build_src = yes
build_src_filter = +<*> -<main.cpp>

; ---------------------------------------------------------------------------
; Unit tests on the PC (test/native), no board needed:
;   pio test -e native
; Runs with AddressSanitizer + UndefinedBehaviorSanitizer.
[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
extra_scripts = pre:tools/sanitizer_link.py
