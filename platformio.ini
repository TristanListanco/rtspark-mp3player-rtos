; BCA182 Laboratory Activity 2 - Personal MP3 Player
; RT-Thread RT-Spark (STM32F407ZGT6) + STM32Cube HAL + FreeRTOS
;
; The black_f407zg board definition uses the same MCU as the RT-Spark
; (STM32F407ZGT6, 1 MB flash, 192 KB RAM). Clock tree, pins and peripherals
; are configured for the RT-Spark in src/board_init.c.

[env:rtspark]
platform = ststm32
board = black_f407zg
framework = stm32cube

; Use our own include/stm32f4xx_hal_conf.h (8 MHz HSE, selected HAL modules)
board_build.stm32cube.custom_config_header = yes

; Cortex-M4F hard-float ABI (required by the FreeRTOS ARM_CM4F port)
extra_scripts = pre:tools/fpu_flags.py

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; On-board ST-LINK (USB-DBG connector) for flashing and debugging
upload_protocol = stlink
debug_tool = stlink

; USART1 (PA9/PA10) is bridged to the ST-LINK virtual COM port
monitor_speed = 115200
